<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="تطبيق أنا مسلم الشامل للأذكار والقرآن الكريم ومواقيت الصلاة والتقويم الهجري">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أنا مسلم">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>أنا مسلم - Ana Muslim Web</title>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #1B1537 0%, #251B4E 50%, #153B4B 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #ffffff;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 40px 48px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.6s ease-out;
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
      margin-top: 16px;
      color: #FACC15;
      text-shadow: 0 2px 10px rgba(250, 204, 21, 0.3);
    }

    .app-sub {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 6px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #FACC15;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
  <script>
    function removeSplashFromWeb() {
      const loader = document.getElementById("web-loader");
      if (loader) {
        loader.style.opacity = "0";
        setTimeout(() => loader.remove(), 400);
      }
    }
  </script>
</head>
<body>
  <div id="web-loader" class="loader-container">
    <div class="spinner"></div>
    <div class="app-title">أنا مسلم</div>
    <div class="app-sub">جاري تحميل التطبيق...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
