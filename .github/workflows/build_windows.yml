name: Build Windows Desktop Application

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'الموقع الاكروني الخاص  بالتطبيق/**'
      - '*.md'
      - '*.pdf'
      - '*.py'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Sync DLLs and Package Zip
        shell: powershell
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zipPath = "build/AnaMuslim_Windows_v1.0.7.zip"
          
          # Copy any nested plugin DLLs to release dir
          Get-ChildItem -Path "build/windows" -Filter "*.dll" -Recurse | ForEach-Object {
              if (-not (Test-Path "$releaseDir/$($_.Name)")) {
                  Copy-Item $_.FullName -Destination $releaseDir -Force
              }
          }
          
          # Compress Release folder to zip archive
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath successfully"

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnaMuslim-Windows-Desktop-v1.0.7
          path: build/AnaMuslim_Windows_v1.0.7.zip
